name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs so a moved tag cannot change what runs.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the oldest supported Python (macOS's /usr/bin/python3); the scripts use only the standard library.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q tests
      - run: python -I scripts/gw_draft.py --help && python -I scripts/gw_learn.py --help
      - run: sh -n bin/draft && test -x bin/draft
